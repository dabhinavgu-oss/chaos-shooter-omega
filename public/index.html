<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chaos Shooter Omega — 3D Voxel Multiplayer</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
  <div id="game"></div>
  <div id="hud">
    <div id="crosshair">+</div><div id="waveBanner"></div>
    <div id="score">SCORE <b id="scoreVal">0</b></div><div id="wave">WAVE <b id="waveVal">1</b></div><div id="players">PLAYERS <b id="playerVal">1</b></div><div id="left">LEFT <b id="leftVal">0</b></div>
    <div id="reviveDevices">REVIVE <b id="reviveVal">0</b></div><div id="killfeed"></div><div id="reviveHud"></div>
    <div id="healthWrap"><div id="healthBar"></div><span>HP</span></div><div id="shieldWrap"><div id="shieldBar"></div><span>SHIELD</span></div>
    <div id="hotbar"></div><div id="ammo"></div><div id="scoreboard"></div>
  </div>
  <div id="startScreen"><div id="startBox"><h1>CHAOS SHOOTER OMEGA</h1><input id="nameInput" maxlength="16" placeholder="NAME"><input id="colorInput" type="color" value="#44ddff"><button id="playBtn">CLICK TO PLAY</button><p>WASD • SPACE • CLICK • R • 1-8 • G • Q • TAB</p></div></div>
  <div id="deadOverlay"><div>YOU DIED</div><small id="deadText"></small></div>
  <div id="spectateOverlay"><div>SPECTATING</div><small id="spectateText"></small></div>
  <div id="gameOverOverlay"><div>GAME OVER</div><button id="restartBtn">RETURN TO MENU</button></div>
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/map-boot.js?v=zombiesfix4"></script>
  <script src="/game.js?v=zombiesfix4"></script>
  <script src="/map-visuals.js?v=zombiesfix4"></script>
  <script src="/map-world.js?v=zombiesfix4"></script>
  <script src="/home-preload.js?v=zombiesfix4"></script>
  <script src="/home.js?v=zombiesfix4"></script>
</body>
</html>
